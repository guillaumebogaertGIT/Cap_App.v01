name: Backend tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Show Java and Maven versions
        working-directory: backend
        run: |
          java -version
          sh ./mvnw --version
      - name: Run backend tests
        working-directory: backend
        run: sh ./mvnw --batch-mode --no-transfer-progress clean test
