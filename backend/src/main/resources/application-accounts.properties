# Run separately from the existing preview while its APIs are migrated.
server.port=8081
cap.mail.enabled=${CAP_MAIL_ENABLED:false}
cap.mail.public-url=${CAP_PUBLIC_URL:}
cap.mail.from=${CAP_MAIL_FROM:}
# SMTP delivery is opt-in; set SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD privately when ready.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.autoconfigure.exclude=
spring.datasource.url=${CAP_DATABASE_URL}
spring.datasource.username=${CAP_DATABASE_USER}
spring.datasource.password=${CAP_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.locations=classpath:db/migration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set true behind HTTPS before deployment; false supports localhost development.
server.servlet.session.cookie.secure=${CAP_COOKIE_SECURE:false}
cap.accounts.bootstrap-email=${CAP_COACH_EMAIL:}
cap.accounts.bootstrap-password=${CAP_COACH_PASSWORD:}
cap.accounts.membership-reviewers=${CAP_MEMBERSHIP_REVIEWER_EMAILS:}
# Avoid request-body/token logging when a developer has enabled root DEBUG.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.springframework.security=INFO

# Keep SQL bind values, session details and request content out of ordinary logs.
logging.level.org.springframework.jdbc.core.JdbcTemplate=INFO
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=INFO
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Opt-in TEST MODE only. Never put key values in this file or frontend code.
cap.billing.enabled=${CAP_STRIPE_TEST_ENABLED:false}
cap.accounts.finance-reviewer=${CAP_FINANCE_REVIEWER_EMAIL:}
cap.accounts.staff-manager=${CAP_STAFF_MANAGER_EMAIL:}
cap.billing.secret=${CAP_STRIPE_TEST_SECRET_KEY:}
cap.billing.webhook-secret=${CAP_STRIPE_TEST_WEBHOOK_SECRET:}
cap.billing.price=${CAP_STRIPE_TEST_PRICE_ID:}
cap.billing.prices=${CAP_STRIPE_TEST_PRICES:{}}
cap.billing.enforce-bookings=${CAP_TEST_PAID_BOOKINGS:false}
cap.billing.portal=${CAP_STRIPE_TEST_PORTAL_CONFIGURATION_ID:}
cap.billing.base-url=${CAP_STRIPE_TEST_BASE_URL:http://127.0.0.1:8081}
cap.ai-coach.enabled=${CAP_AI_COACH_ENABLED:false}
cap.ai-coach.key=${OPENAI_API_KEY:${CAP_OPEN_AI_KEY:}}
cap.ai-coach.testers=${CAP_AI_COACH_TEST_EMAILS:}
