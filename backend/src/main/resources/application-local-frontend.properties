# Enabled by the local launcher only. The location must include a trailing slash.
cap.frontend-location=${CAP_FRONTEND_LOCATION}
# Keep safe account error/logging defaults instead of DevTools' verbose defaults.
spring.devtools.add-properties=false
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s
spring.devtools.livereload.enabled=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
# Keep the existing logout-on-restart behavior, without session files on disk.
server.servlet.session.persistent=false
