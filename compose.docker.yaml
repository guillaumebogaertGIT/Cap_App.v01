# CAP app only. Existing PostgreSQL stays on Windows; no database service/volume.
name: cap-docker
services:
  app:
    image: cap-local:dev
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${CAP_DOCKER_HTTP_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: accounts
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8081"
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/run/secrets/cap-runtime.yaml
    secrets:
      - source: cap_runtime
        target: cap-runtime.yaml
    # Compose environment-backed secrets require a writable container root filesystem.
    # The app still runs as a non-root user with all Linux capabilities dropped.
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    restart: "no"
secrets:
  cap_runtime:
    environment: CAP_DOCKER_RUNTIME_CONFIG
